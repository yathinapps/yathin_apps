  if(t<.3){const a=1-t/.3,r=24+110*t/.3,g=ctx.createRadialGradient(cx,cy0,0,cx,cy0,r);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(.4,`rgba(255,246,170,${a*.85})`);g.addColorStop(1,'rgba(255,200,60,0)');ctx.fillStyle=g;ctx.fillRect(cx-r,cy0-r,r*2,r*2);}
  /* pixel fireball, growing to ~3x the dino's height, then cooling into smoke */
  if(t<1.4){const P=4,grow=1-Math.pow(1-Math.min(1,t/.35),3),R=10+47*grow+6*Math.max(0,t-.35),cy=cy0-R*.35,h=Math.min(1,t/1),al=t<.9?1:Math.max(0,1-(t-.9)/.5),fr=Math.floor(t*14);
    const hot=['#ffffff','#fff3b0','#ffde59','#ffb02e','#ff8c1a','#ff3d1a','#b3261a'],cool=['#8a8494','#6e6878','#5c5568','#4b4458','#3a3448'];
    ctx.globalAlpha=al;const n=Math.ceil(R*1.25/P);
    for(let j=-n;j<=n;j++)for(let i=-n;i<=n;i++){const x=cx+i*P,y=Math.round(cy+j*P);if(y>GY+2)continue;
      const dd=Math.hypot(i*P,j*P)/R,rr=1+(hn(i,j,fr)-.5)*.45;if(dd>rr)continue;
      const q=Math.min(.999,dd/rr),shift=h*1.6,k=q+shift+hn(j,i,fr)*.15;
      ctx.fillStyle=k<1?hot[Math.min(6,Math.floor((q+h*.8)*7))]:cool[Math.min(4,Math.floor((k-1)*3.2))];ctx.fillRect(Math.round(x-P/2),y,P,P);}
    ctx.globalAlpha=1;}
  /* pixel shockwave ring */
  if(t<.75){const u=t/.75,r=12+260*(1-Math.pow(1-u,2)),a=1-u,P=3,n=Math.max(24,Math.floor(r*2*Math.PI/(P*2)));
    for(let i=0;i<n;i++){const an=i/n*Math.PI*2,x=Math.round((cx+Math.cos(an)*r)/P)*P,y=Math.round((cy0+Math.sin(an)*r*.8)/P)*P;if(y>GY+2)continue;
      ctx.globalAlpha=a;ctx.fillStyle=i%3?'#fff3b0':'#ff8c1a';ctx.fillRect(x,y,P,P);
      ctx.globalAlpha=a*.5;ctx.fillStyle='#ffffff';const r2=r*.86,x2=Math.round((cx+Math.cos(an)*r2)/P)*P,y2=Math.round((cy0+Math.sin(an)*r2*.8)/P)*P;if(y2<=GY+2&&i%2===0)ctx.fillRect(x2,y2,P,P);}
    ctx.globalAlpha=1;}
}
function drawMeteors(){
  for(const m of meteors){if(m.hit)continue;
    if(m.mega){const w=154,h=126,ux=m.sx-m.tx,uy=m.sy-m.ty,L=Math.hypot(ux,uy),nx=ux/L,ny=uy/L,px=-ny,py=nx,tl=320;
      const g=ctx.createLinearGradient(m.x,m.y,m.x+nx*tl,m.y+ny*tl);g.addColorStop(0,'rgba(255,236,140,.85)');g.addColorStop(.35,'rgba(255,140,30,.55)');g.addColorStop(1,'rgba(255,50,20,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(m.x+px*66,m.y+py*66);ctx.lineTo(m.x+nx*tl,m.y+ny*tl);ctx.lineTo(m.x-px*66,m.y-py*66);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,120,30,.22)';ctx.beginPath();ctx.arc(m.x,m.y,84,0,7);ctx.fill();
      const ix=Math.round(m.x-w/2),iy=Math.round(m.y-h/2);
      ctx.save();ctx.shadowColor='#ff6a00';ctx.shadowBlur=26*S;ctx.drawImage(WIFI_F,ix,iy,w,h);ctx.restore();
      ctx.globalAlpha=.5+.3*Math.sin(T*30);ctx.drawImage(WIFI_H,ix,iy,w,h);ctx.globalAlpha=1;continue;}
    const w=11*2*m.sz/2,h=9*2*m.sz/2;
    ctx.save();ctx.shadowColor='#ffb02e';ctx.shadowBlur=10*S;ctx.drawImage(WIFI,Math.round(m.x),Math.round(m.y),w,h);ctx.restore();}
}
function hud(){
  const col=state==='start'?'#535353':'#9cff3a',out='#14210a';
  if(!(blinkT>0&&Math.floor(blinkT*8)%2===0)){txt(fmtScore(score),592,6,2,col,2,out);}
  const sw=fmtScore(score).length*8-2;
  if(hi>0){ctx.globalAlpha=.8;txt('HI '+fmtScore(hi),592-sw-14,6,2,col,2,out);ctx.globalAlpha=1;}
  const tw=txt(fmtTime(playTime),592,22,2,'#ffffff',2,out);
  const tc=['#9cff3a','#ffb02e','#ff3b5c'][tier];
  txt(['NORMAL','HARD','INSANE'][tier],592-tw-12,22,2,tc,2,out);
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,W,H);
  if(state==='start'){
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#535353';ctx.fillRect(0,GY+1,W,1);
    for(let i=0;i<40;i++){ctx.fillRect((i*53)%W,GY+4+(i%3)*2,i%2?2:1,1);}
    ctx.drawImage(D_MONO,50,GY+1-38,44,38);
    return;
  }
  ctx.save();
  if(shake>0)ctx.translate(Math.round(rnd(-1,1)*shake*6),Math.round(rnd(-1,1)*shake*6));
  if(xb&&state==='cutscene'&&xb.t<.6){const k=Math.pow(1-xb.t/.6,1.5)*12;ctx.translate(Math.round(rnd(-1,1)*k),Math.round(rnd(-1,1)*k));}
  drawWorld();drawObstacles();
  for(const s of speedLines){ctx.fillStyle=`rgba(255,255,255,${s.a*.7})`;ctx.fillRect(Math.round(s.x-s.l),Math.round(s.y),Math.round(s.l),2);}
  drawDino();drawBlast();drawParts();drawMeteors();
  for(const r of rings){if(r.r<=0)continue;const a=Math.min(1,r.a);ctx.lineWidth=r.w;
    ctx.strokeStyle=`rgba(255,236,190,${a})`;ctx.beginPath();ctx.ellipse(r.x,GY,r.r,r.r*.22,0,0,7);ctx.stroke();
    ctx.strokeStyle=`rgba(255,160,60,${a*.6})`;ctx.beginPath();ctx.arc(r.x,GY,r.r*.75,Math.PI,2*Math.PI);ctx.stroke();}
  if(state==='cutscene'&&ct>=6.4&&ct<7.6){const a=ct-6.4,k=1-Math.pow(1-Math.min(1,a/.25),3),sc=Math.max(1,Math.round(1+5*k));
    ctx.globalAlpha=a>1?Math.max(0,1-(a-1)/.2):1;txt('ROAR!',Math.round(100+70*k+rnd(-1,1)),Math.round(112-62*k+rnd(-1,1)),sc,'#9cff3a',1,'#14210a');ctx.globalAlpha=1;}
  if(state==='cutscene'&&ct>=8.4&&ct<9.2){const a=ct-8.4,u=Math.min(1,a/.14),k=u<1?1.25*u:1.25-.25*Math.min(1,(a-.14)/.1),sc=Math.max(1,Math.round(8*k)),bx=Math.round(150+rnd(-2,2)*(1-a)),by=Math.round(70-sc*2.5+rnd(-2,2)*(1-a));
    ctx.globalAlpha=a>.62?Math.max(0,1-(a-.62)/.18):1;
    txt('BOOM!',bx,by,sc,'#ff8c1a',1,'#2a0a00');txt('BOOM!',bx,by-Math.max(1,Math.round(sc/3)),sc,'#ffde59',1);ctx.globalAlpha=1;}
  ctx.restore();
  if(state==='cutscene'&&ct>=9.2+XB&&ct<10.8+XB&&Math.floor((ct-9.2-XB)*6)%2===0){ctx.fillStyle='rgba(255,30,60,.22)';ctx.fillRect(0,44,W,32);txt('MEGA METEOROID',W/2,50,4,'#ff3b5c',1,'#1a0710');}
  if(connA>0&&state==='cutscene'){ctx.globalAlpha=connA;ctx.save();ctx.shadowColor='#7dff8a';ctx.shadowBlur=14*S;ctx.drawImage(WIFI_G,W/2-33,14,66,54);ctx.restore();txt('CONNECTED',W/2,78,4,'#7dff8a',1,'#0b2a10');ctx.globalAlpha=1;}
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
  if(state==='run'||state==='over')hud();
  if(state==='cutscene'){hud();if(ct>2)txt('SPACE / TAP TO SKIP',592,166,1.5,'#ffffff',2,'#14210a');}
  if(banner&&Math.floor(banner.a*6)%2===0){txt(banner.t,W/2,58,5,banner.t[0]==='H'?'#ffb02e':'#ff3b5c',1,'#1a0710');}
  if(state==='over'){txt('GAME OVER',W/2,46,3,'#9cff3a',1,'#14210a');ctx.drawImage(RESTART,W/2-14,72,28,24);}
  if(state==='win'){
    ctx.fillStyle=doom>0?`rgba(${10+6*doom|0},${8-4*doom|0},${30-26*doom|0},${.55-.27*doom})`:'rgba(10,8,30,.55)';ctx.fillRect(0,0,W,H);drawParts();
    txt('YOU WIN!',W/2,20,6,'#ffd23f',1,'#3a1a00');
    txt('SCORE '+fmtScore(score),W/2,62,2,'#9cff3a',1,'#14210a');
    txt('TIME 9:00:00',W/2,80,2,'#ffffff',1,'#14210a');
  }
  if(paused){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,62,4,'#ffffff',1,'#000');txt('TAP OR PRESS A KEY',W/2,92,2,'#ffffff',1,'#000');}
  if(wipe<1){
    const wx=Math.round(wipe*W);
    ctx.fillStyle='#fff';ctx.fillRect(wx,0,W-wx,H);ctx.fillStyle='#535353';ctx.fillRect(wx,GY+1,W-wx,1);
    const g=ctx.createLinearGradient(wx-24,0,wx,0);g.addColorStop(0,'rgba(156,255,58,0)');g.addColorStop(1,'rgba(156,255,58,.9)');ctx.fillStyle=g;ctx.fillRect(wx-24,0,24,H);
  }
}
let last=performance.now();
function loop(now){
  let ms=now-last;last=now;if(ms>50)ms=50;if(ms<0)ms=0;
  if(!paused)update(ms/16.667,ms/1000);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
